name = "Giant Rat"
hp = 5
defense = 10
attack = 2
damage = "1d4"
xp = 6
tier = 1
tags = ["vermin", "beast"]
weak = ["food", "loud"]
tell = "bares its yellow teeth and crouches to spring"

