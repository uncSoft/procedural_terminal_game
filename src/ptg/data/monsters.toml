# Monsters. Art lives in art.txt under a matching `=== key ===` header.
# `defense` is the d20 roll the player needs (after bonuses) to hit.
# `intelligent` monsters can be talked to, bribed or bluffed.
# `weak` lists tags that work especially well against it (see items.toml / tags.toml).
#   "food" and "shiny" weaknesses also let you distract (pacify) the monster.
# `tell` is how it telegraphs a heavy attack.

[monster.giant_rat]
name = "Giant Rat"
hp = 5
defense = 10
attack = 2
damage = "1d4"
xp = 6
tier = 1
tags = ["vermin", "beast"]
weak = ["food", "loud"]
tell = "bares its yellow teeth and crouches to spring"

[monster.goblin]
name = "Goblin"
hp = 8
defense = 11
attack = 3
damage = "1d6"
xp = 10
tier = 1
tags = ["goblinoid"]
intelligent = true
weak = ["shiny", "loud"]
tell = "shrieks and lifts its rusty cleaver over its head"

