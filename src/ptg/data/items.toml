# kind: weapon | armor | consumable | key | trinket
# Weapons roll `damage` and add the player's might. Armor adds `defense`.
# Consumables restore `heal` HP, let you escape a fight if `escape = true`, or cure what ails you (`cures`, with
# `guards` against the next of it: see statuses.toml). Anything can ward a status off for good while it works for you
# (`wards`: worn, for armor and weapons; carried, for anything else).
# `tags` matter for creative actions: using a tagged thing earns a flair bonus,
# and a tag a monster is weak to gives advantage and bigger effects.

