tags = ["plant", "fungus", "spores", "glowing", "poison_immune", "guardian"]
weak = ["fire", "sharp"]
tell = "puffs up her cap and lowers it at you like a ram"
desc = "A plump violet toadstool with a soft green glow in her middle, like a lamp in a window. She hums to the others under her breath, and wherever she hums, the hurt ones close up and grow back. She never hurries. She doesn't have to."
dungeons = ["underbloom"]
tricks = ["mend"]

