# The Underbloom's boss, the game's first fight against several at once (docs/plans/multi-foe-fights.md): its great
# cap and the three that grow round it, each with its own health and its own job. Stand-in sprites till JT's.
[monster.humongous_fungus]
name = "The Humongous Fungus"
hp = 100
defense = 13
attack = 4
damage = "2d6"
xp = 150
tier = 4
tags = ["plant", "fungus", "spores", "glowing", "poison_immune", "boss"]
boss = true
weak = ["fire", "light"]
tell = "swells its great cap till it glows white, and every thread in the bed pulls tight under you"
desc = "The biggest living thing under the world: one fungus, grown through every crack from here to the sea, and this is the cap of it. It's as wide as a house and glows a cold, drowsy blue, and it breathes, slowly, in clouds. Its family grows round it and fights for it. It drank Serpentis's poison for a billion years, and now it has a taste for adventurers."
dungeons = ["underbloom"]
party = ["spore_mother", "rot_gill", "puff_mound"]

