# How each item's 3D model is made from its sprite (item_model.py makes them; README.md says how to add one).
#
#   slab     flat things, given depth: blades, keys, cards, sheets  (thick: how many pixels thick, 2 if it doesn't say)
#   puffed   soft, round, lumpy things, as a relief thicker toward the middle: food, clothes, skulls, creatures
#   turned   round, upright things, turned on a lathe from the sprite's rows: bottles, pots, bombs, torches
#   jar      a glass jar with something in it: the glass as its outline, what's inside floating, facing you
#   ring, dice, cheese   shaped by hand in the sprite's colours, where the sprite can't say the shape
#   blender  made in Blender by its own build script (the Jar o' Light: build_jar.py, "live")
#
# Any of them can also say `pitch`: how far down it's looked at to begin with, in degrees.
# An item that isn't listed is made as a slab.

