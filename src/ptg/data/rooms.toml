# Room archetypes. `names` are picked at random, `blurb` is the plain-text
# description used when no language model is available, `features` are
# things in the room the player can search, and `decor` picks how the room's
# map is painted (water, pillars, bones, rubble, tables, cages, junk, fungus,
# roots, plants, shelves, furniture, pool, embers, caps, threads, puffballs).
# Add `sky` for a room open to the sky: its picture shows broken walls under
# the stars. Add `dark` for a room where nothing glows, on a dark floor: only
# your torch lights it.

# --- The Sunken Crypt -------------------------------------------------------

[archetype.flooded_nave]
decor = "water pillars"
names = ["Flooded Nave", "Drowned Gallery"]
blurb = "Knee-deep black water fills a long hall. Pillars rise out of it like the trunks of drowned trees."
features = ["a half-sunken pew", "a toppled saint's statue", "a floating hymn chest"]

[archetype.ossuary]
decor = "bones"
names = ["Ossuary", "Bone Gallery"]
blurb = "Skulls are stacked floor to ceiling in neat, judgemental rows."
features = ["a niche of polished skulls", "a heap of loose bones", "an offering bowl"]

[archetype.reliquary]
decor = "pillars"
names = ["Reliquary", "Saint's Alcove"]
blurb = "Glass cases line the walls, most of them smashed. Whatever was holy here has been picked over."
features = ["a cracked glass case", "a gilded box", "a prayer rail"]

[archetype.cistern]
decor = "pool"
names = ["Cistern", "Old Well Chamber"]
blurb = "A round chamber around a deep well. Something far below makes slow, patient ripples."
features = ["a rope and bucket", "a rusted drain grate", "a ledge above the waterline"]

[archetype.collapsed_tunnel]
decor = "rubble"
names = ["Collapsed Tunnel", "Cave-in"]
blurb = "Half the ceiling has come down. The way through is a crawl over wet rubble."
features = ["a crushed wheelbarrow", "a gap in the rubble"]

[archetype.vestry]
decor = "furniture"
names = ["Vestry", "Robing Room"]
blurb = "Mouldering vestments hang from hooks, swaying though there is no draft."
features = ["a wardrobe of rotten robes", "a writing desk", "a candle stand"]

[archetype.catacomb]
decor = "shelves"
names = ["Catacomb", "Burial Corridor"]
blurb = "Burial shelves are cut into both walls. Several of them are empty, which is worse."
features = ["a sealed burial shelf", "a smashed coffin", "a mourner's lantern"]

[archetype.bell_shaft]
decor = "rubble"
names = ["Bell Shaft", "Sunken Belfry"]
blurb = "A fallen bell lies cracked on the floor. A shaft climbs into darkness overhead."
features = ["the cracked bell", "a coil of bell rope"]

[archetype.abbots_sanctum]
decor = "water pillars"
names = ["The Abbot's Sanctum"]
blurb = "A flooded chapel lit by drowned candles. An altar rises from the water; the air tastes of old prayer."
features = ["the drowned altar"]

# --- The Goblin Warren ------------------------------------------------------

[archetype.feast_hall]
decor = "tables"
names = ["Feast Hall", "Mess Cave"]
blurb = "Long tables made of doors. Half-eaten food everywhere, and none of it is identifiable."
features = ["a stew cauldron", "a pile of stolen plates", "a barrel of 'ale'"]

[archetype.kennels]
decor = "cages"
names = ["Kennels", "Wolf Pens"]
blurb = "Cages of bent iron and chewed bones. The straw is warm."
features = ["a feeding trough", "a chewed-up saddle", "an open cage"]

[archetype.trash_heap]
decor = "junk"
names = ["Midden", "Trash Heap"]
blurb = "A mountain of garbage, carefully sorted into categories only a goblin would understand."
features = ["a promising pile of junk", "a broken cart", "a sack of 'treasures'"]

[archetype.guard_post]
decor = "furniture"
names = ["Guard Post", "Lookout"]
blurb = "A barricade of furniture and a sign that says KEEP OWT in three different handwritings."
features = ["a weapon rack", "a dice table", "a warning gong"]

[archetype.shrine_of_junk]
decor = "junk"
names = ["Shrine of Junk", "Holy Scrap Pile"]
blurb = "A shrine to a god made of pots, pans and one very confused taxidermied owl."
features = ["the junk idol", "an offering bowl", "a pile of candle stubs"]

[archetype.mushroom_farm]
decor = "fungus"
names = ["Mushroom Farm", "Fungus Beds"]
blurb = "Glowing mushrooms grow in neat rows. A few of them seem to be watching you."
features = ["a giant puffball", "a harvest basket", "a compost pit"]

[archetype.sleeping_burrow]
decor = "junk"
names = ["Sleeping Burrow", "Snore Den"]
blurb = "Nests of rags and stolen blankets. The smell is a physical presence."
features = ["a lumpy bedroll", "a stash under a rock", "a pile of stolen boots"]

[archetype.forge_pit]
decor = "embers"
names = ["Forge Pit", "Smithy"]
blurb = "A forge built from a stolen bathtub. The anvil is a sleeping troll's helmet."
features = ["the bathtub forge", "a scrap bin", "a tool wall"]

[archetype.throne_cave]
decor = "pillars junk"
names = ["The Throne Cave"]
blurb = "A cavern lit by a hundred stolen lanterns. A throne of stacked chairs leans against the far wall."
features = ["the throne of chairs"]

# --- The Overgrown Ruins ----------------------------------------------------

[archetype.root_choked_hall]
decor = "roots"
names = ["Root-Choked Hall", "Strangled Corridor"]
blurb = "Roots as thick as your arm have pried apart the marble. They creak when you are not looking at them."
features = ["a root-wrapped statue", "a cracked mosaic", "a fallen chandelier"]

[archetype.star_chamber]
decor = "pillars"
names = ["Star Chamber", "Orrery Hall"]
blurb = "A broken brass orrery hangs from the domed ceiling. Moss has grown into the shapes of constellations."
features = ["the brass orrery", "a star chart table", "a telescope stand"]

[archetype.greenhouse]
decor = "plants sky"
names = ["Greenhouse", "Glass Garden"]
blurb = "Shattered glass panes overhead. The plants in here are far too large and far too awake."
features = ["a potting bench", "a glass cloche", "a tangle of creepers"]

[archetype.collapsed_library]
decor = "shelves"
names = ["Collapsed Library", "Mossy Archive"]
blurb = "Shelves have toppled like dominoes. The books have sprouted."
features = ["a sprouting bookshelf", "a reading lectern", "a toppled card catalog"]

[archetype.fountain_court]
decor = "pool plants sky"
names = ["Fountain Court", "Moonwell"]
blurb = "A dry fountain in a courtyard open to the sky. Petals drift down like slow snow."
features = ["the dry fountain", "a mossy bench", "a wishing basin"]

[archetype.spore_grotto]
decor = "fungus"
names = ["Spore Grotto", "Mould Cellar"]
blurb = "Every surface is furred with pale mould. Each step releases a puff of glittering spores."
features = ["a mould-covered chest", "a puffing fungus", "a skeleton wrapped in mycelium"]

[archetype.statue_garden]
decor = "pillars plants sky"
names = ["Statue Garden", "Hall of Wardens"]
blurb = "Elven statues stand guard, each one strangled by flowering vines."
features = ["a statue with an outstretched hand", "a vine-covered plinth", "a broken sword in the soil"]

[archetype.hollow_tree]
decor = "roots"
names = ["Hollow Tree", "Heartless Oak"]
blurb = "The room is the inside of a hollow tree that grew straight through the floor."
features = ["a knot hole", "a bird's nest", "a sap-filled crack"]

[archetype.heartwood]
decor = "roots plants"
names = ["The Heartwood"]
blurb = "A cathedral of living wood around a pulsing green heart. Everything in it leans toward you, as if listening."
features = ["the pulsing heart"]

# --- Shops: in no dungeon's list, a shopkeeper sets up wherever she likes (world._shop) ---

[archetype.shop]
decor = "shelves"
names = ["Shop"]
blurb = "A shopkeeper has set up in a nook of the dungeon: a counter of old planks, and everything she owns behind it."
features = ["the counter"]

# --- Norfel (floor 4: Metroid's Norfair, poisoned) ------------------------

[archetype.bubbling_cavern]
decor = "pool"
names = ["Bubbling Cavern", "Boiling Grotto"]
blurb = "The purple rock here is all bubbles, round cells inside round cells, and some of them are still popping. A pool of glowing magenta poison steams in the middle."
features = ["a cluster of rock bubbles", "the pool's crusted edge", "a cracked bubble the size of a door"]

[archetype.river_crossing]
decor = "water"
names = ["River Crossing", "Poison Ford"]
blurb = "A river of thick, glowing poison cuts the cave in two. Stepping stones poke out of it, slick and purple."
features = ["a stepping stone", "a heap of washed-up junk", "the far bank"]

[archetype.vent_field]
decor = "rubble embers"
names = ["Vent Field", "Hissing Flats"]
blurb = "The floor is cracked with vents that hiss yellow-green gas in slow puffs. Your eyes water before you're three steps in."
features = ["a cold, dead vent", "a ring of stained rocks", "a skeleton that didn't hold its breath"]

[archetype.pillar_hall]
decor = "pillars"
names = ["Pillar Hall", "Hall of Grey Columns"]
blurb = "Grey stone pillars with pale caps hold up the purple rock, too regular to be natural. Somebody built this, a long time ago, and left in a hurry."
features = ["a pillar's hollow cap", "carvings of a bird-headed people", "a toppled column"]

[archetype.egg_chamber]
decor = "fungus"
names = ["Egg Chamber", "The Clutch"]
blurb = "Leathery eggs as big as barrels sit in a soft nest of shed skin. Most of them are broken, from the inside."
features = ["a broken egg", "an unbroken egg (careful)", "a nest of old skins"]

[archetype.statue_alcove]
decor = "pillars"
names = ["Statue Alcove", "The Old Watcher"]
blurb = "A bird-headed statue sits on its heels in an alcove, palms held out, as if it has been waiting a very long time to hand someone something."
features = ["the statue's open hands", "a ring of old offerings"]

[archetype.serpents_lair]
decor = "pool embers"
names = ["Serpentis's Lair"]
blurb = "A round cavern ringed with stone fangs that hang from the ceiling like a jaw about to close. The floor is pocked with round red cells that glow and pulse, and coils of shed skin lie everywhere, each bigger than the last."
features = ["a heap of shed skins", "a glowing red floor cell"]

# --- The Underbloom (floor 5, under Norfel: not in a run yet) ----------------
# Norfel's poison drips down here, and something learned to drink it. Black
# rock furred with white threads, lit only by what grows (and your torch).

[archetype.glowcap_grove]
decor = "caps fungus"
names = ["Glowcap Grove", "The Lantern Wood"]
blurb = "Mushrooms as tall as trees stand in the dark, their caps glowing cold blue and violet overhead. Spores drift down through their light like slow snow, and settle on you."
features = ["a giant glowcap's stalk", "a fallen glowcap, soft as bread", "a ring of little caps in the moss"]

[archetype.puffball_field]
decor = "puffballs fungus"
names = ["Puffball Field", "The Spore Drift"]
blurb = "The floor is crowded with pale puffballs, from fist-sized to cart-sized. Each one you brush sighs out a cloud of glittering spores, and they hang in the air a long time."
features = ["a puffball as big as a cart", "a burst puffball, empty and wrinkled", "a trail of footprints in the spore dust"]

[archetype.thread_hall]
decor = "threads fungus"
names = ["Thread Hall", "The Weave"]
blurb = "White threads hang from the ceiling to the floor in curtains, fine as hair and slightly sticky. They sway when you breathe. Things are wrapped up in them here and there, and some of the things are moving."
features = ["a cocoon wrapped in white threads", "a curtain of threads, thick as a rope", "a bundle that might be a backpack"]

[archetype.mouldering_ossuary]
decor = "bones fungus"
names = ["The Compost", "Mouldering Ossuary"]
blurb = "This is where the dead of the floors above end up, washed down through the cracks: bones and old gear, all of it furred in soft grey mould and sprouting little glowing caps. The floor is soft. You try not to think about why."
features = ["an adventurer's skeleton, sprouting caps", "a heap of mouldering gear", "a skull with a mushroom growing out of one eye"]

[archetype.runoff_pool]
decor = "pool fungus"
names = ["The Drip", "Runoff Pool"]
blurb = "Norfel's poison drips from a crack in the ceiling into a pool, still glowing pink. The fungus crowds round its edge to drink, and glows brightest where it does."
features = ["a glowcap leaning down to drink", "a drip from the ceiling", "a puffball floating in the pool"]

[archetype.sporerat_burrow]
decor = "junk fungus"
names = ["Sporerat Burrow", "The Nibbled Tunnels"]
blurb = "Tunnels gnawed through the soft rock, lined with shredded caps and stolen things. Something squeaks, a long way off. Then a lot of somethings do."
features = ["a nest of shredded mushroom", "a gnawed satchel", "a hoard of shiny bits"]

[archetype.dark_hollow]
decor = "rubble dark"
names = ["The Dark Hollow", "Blind Cave"]
blurb = "Nothing grows here, and nothing glows. The dark is so thick it feels like a wall pressing on your eyes. Without a light of your own, you'd be feeling your way."
features = ["bones that crunch underfoot", "a toppled statue, worn smooth", "a cold draught from somewhere"]

[archetype.swallowed_chapel]
decor = "pillars fungus"
names = ["The Swallowed Chapel", "Overgrown Chapel"]
blurb = "Somebody built a chapel down here once. The fungus has eaten most of it: the pillars are furred white, the pews have gone soft as cake, and a pale light glows where the altar was."
features = ["a pew soft as cake", "a saint's statue in a coat of mould", "the altar, glowing faintly"]
