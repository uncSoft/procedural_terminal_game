[project]
name = "ptg"
version = "0.3.0"
description = "Procedural Terminal Game: a seeded dungeon crawl narrated by a local or API language model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pillow>=13.0.0",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
claude = [
    "anthropic>=2.1",
]
web = [
    "textual-serve>=1.1.3,<1.2",  # `ptg serve` builds on parts of it (serve.py)
]

[project.scripts]
ptg = "ptg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "textual-serve>=1.1.3,<1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptg"]

[tool.pytest.ini_options]
# In parallel: nine tenths of the time is the UI tests, mostly waiting on the app (animations, dice, narration), so
# they overlap well, and each test has its own PTG_HOME (conftest.py). -n0 runs one at a time (for a debugger, or
# print()).
addopts = "-n auto --dist worksteal"
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = ["llm: needs a running language model (set PTG_LLM_URL)"]
