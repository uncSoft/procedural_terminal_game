# Room features get tags from words in their names, so "a stew cauldron" is
# heavy, hot and food. Creative actions that use a tagged thing earn flair, and
# tags that match a monster's weakness give advantage.

[keywords]
cauldron = ["heavy", "fire", "food"]
stew = ["food", "fire"]
ale = ["liquid", "food"]
barrel = ["heavy", "liquid"]
plates = ["shiny", "loud"]
treasures = ["shiny"]
junk = ["shiny", "heavy"]
idol = ["heavy", "shiny"]
owl = ["shiny"]
candle = ["fire", "light"]
candles = ["fire", "light"]
lantern = ["fire", "light"]
chandelier = ["heavy", "light"]
forge = ["fire", "heavy"]
bathtub = ["heavy", "fire"]
anvil = ["heavy"]
statue = ["heavy"]
saint = ["heavy", "holy"]
altar = ["holy", "heavy"]
prayer = ["holy"]
hymn = ["holy"]
reliquary = ["holy", "shiny"]
gilded = ["shiny"]
glass = ["glass", "shiny"]
bell = ["heavy", "loud"]
gong = ["loud", "shiny"]
rope = ["rope"]
bucket = ["water"]
well = ["water"]
drain = ["water"]
fountain = ["water"]
basin = ["water", "shiny"]
pew = ["heavy", "holy"]
bones = ["heavy", "loud"]
skulls = ["heavy", "loud"]
coffin = ["heavy"]
sarcophagus = ["heavy"]
rubble = ["heavy"]
wheelbarrow = ["heavy"]
cart = ["heavy"]
cage = ["heavy", "metal"]
trough = ["food", "water"]
saddle = ["heavy"]
weapon = ["sharp", "metal"]
dice = ["shiny"]
mushroom = ["food", "spores"]
puffball = ["spores"]
fungus = ["spores"]
mould = ["spores"]
mycelium = ["spores"]
compost = ["smelly"]
basket = ["food"]
boots = ["smelly"]
bedroll = ["smelly"]
orrery = ["heavy", "shiny", "metal"]
telescope = ["glass", "shiny"]
chart = ["paper"]
bookshelf = ["heavy", "paper"]
lectern = ["heavy", "paper"]
catalog = ["heavy", "paper"]
creepers = ["plant"]
roots = ["plant"]
vine = ["plant"]
nest = ["food"]
sap = ["sticky"]
sword = ["sharp", "metal"]
plinth = ["heavy"]
mosaic = ["shiny"]
heart = ["plant"]
throne = ["heavy", "shiny"]
